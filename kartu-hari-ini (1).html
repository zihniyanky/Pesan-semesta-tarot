<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kartu hari ini</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#2a2347; --soft:#6f6692; --line:#cfc4ee; --back:#e9e1fb; --front:#f6f2ff;
  --glow:#b99cff; --gold:#c98a2b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --ink:#ece8f6; --soft:#9b93b8; --line:#3b3360; --back:#241d44; --front:#1f1a3a;
    --glow:#8b6bff; --gold:#f3c98b;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --ink:#ece8f6; --soft:#9b93b8; --line:#3b3360; --back:#241d44; --front:#1f1a3a;
  --glow:#8b6bff; --gold:#f3c98b;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:28px 20px;overflow-x:hidden}
.wrap{width:100%;max-width:720px;display:flex;align-items:center;gap:44px}
.card{flex:none;width:190px;aspect-ratio:2/3;perspective:1100px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.card:focus-visible{outline:3px solid var(--glow);outline-offset:6px;border-radius:16px}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;border:1.5px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:var(--back);box-shadow:0 0 36px -6px var(--glow)}
.back svg{width:100%;height:100%;display:block}
.front{background:var(--front);transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;text-align:center;padding:20px 14px 18px}
.front::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:9px}
.front::after{content:"";position:absolute;left:50%;top:42%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,var(--glow) 0%,transparent 60%);opacity:.28}
.num,.name{position:relative;z-index:1}
.num{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:24px;line-height:1;color:var(--gold)}
.art{position:relative;z-index:1;width:80%;flex:1;display:flex;align-items:center;min-height:0}
.art svg{width:100%;height:auto;max-height:100%}
.art .a{fill:var(--glow);fill-opacity:.4}
.name{font-family:"Instrument Serif",Georgia,serif;font-size:20px;line-height:1.15}
.read{flex:1;min-width:0;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hint{margin:0;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:26px;color:var(--soft)}
.date{margin:0;font-size:14px;color:var(--soft)}
.reveal{display:none;flex-direction:column;gap:18px}
.on ~ .read .hint,.read.on .hint{display:none}
.read.on .reveal{display:flex;animation:in .7s ease both .5s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pesan{margin:0;font-family:"Instrument Serif",Georgia,serif;font-size:clamp(22px,3.4vw,29px);line-height:1.3}
.ide{margin:0;padding-top:14px;border-top:1px solid var(--line);font-size:15px;line-height:1.55;color:var(--soft)}
.ide b{font-weight:500;color:var(--gold)}
@media (max-width:560px){
  .wrap{flex-direction:column;gap:28px}
  .read{min-height:0;text-align:left;width:100%}
}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.read.on .reveal{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <button class="card" id="card" type="button" aria-pressed="false" aria-label="Buka kartu hari ini">
    <div class="inner">
      <div class="face back">
        <svg viewBox="0 0 100 150" aria-hidden="true">
          <g fill="none" stroke="var(--line)" stroke-width=".8">

      <p class="pesan" id="pesan"></p>
      <p class="ide"><b>ide</b>&ensp;<span id="ide"></span></p>
    </div>
  </section>
</main>

    ["0","The Fool","Setiap hari adalah peluang baru untuk menyelami hidup dengan rasa takjub, penasaran, dan keberanian melangkah tanpa takut.","Cerita yang bermula dari satu langkah nekat, tanpa peta dan tanpa rencana pulang."],
    ["I","The Magician","Sadarlah betapa berkuasanya dirimu; benahi dulu dunia di dalam dada, maka dunia luar akan mengikutinya.","Seseorang baru sadar bahwa kekuatan yang dicarinya selama ini sudah ada di tangannya sendiri."],
    ["II","The High Priestess","Terkadang, kamu hanya perlu diam dan mendengar bisikan intuisimu, alih-alih terus-terusan memakai logika.","Sesuatu yang tak bisa dijelaskan logika, tapi terasa begitu pasti di dalam dada."],
    ["III","The Empress","Hidup ini tentang merawat, mencipta, dan membiarkan sisi kreatifmu tumbuh subur dengan penuh kelembutan.","Adegan sunyi tentang merawat sesuatu pelan-pelan, entah tanaman, rumah, atau seseorang, sampai ia tumbuh."],
    ["IV","The Emperor","Keteraturan, aturan, dan bimbingan yang tepat adalah fondasi kokoh untuk membangun arah hidup yang jelas.","Seseorang yang menjaga semuanya tetap teratur, sampai datang satu hal yang tak bisa lagi diatur."],
    ["V","The Hierophant","Tak ada salahnya berpijak pada tradisi dan jalur yang sudah teruji untuk menemukan ketenangan.","Aturan lama yang diwariskan turun-temurun, dan satu orang yang mulai mempertanyakannya."],
    ["VI","The Lovers","Cinta dan kesatuan yang tulus memberi kita sayap untuk saling menguatkan dan percaya diri.","Dua orang di persimpangan yang harus memilih jujur, padahal memilih aman jauh lebih mudah."],
    ["VII","The Chariot","Fokus dan jalankan rencanamu dengan kepala dingin serta langkah yang tertata rapi.","Perjalanan yang ditempuh dengan tekad penuh, sementara ragu ikut duduk di kursi sebelah."],
    ["VIII","Strength","Ketahanan mental adalah perisaimu, dan ketulusan hati membuatmu tak pernah gentar menyuarakan kebenaran.","Meredakan sesuatu yang liar, entah amarah, ketakutan, atau makhluk, dengan kelembutan dan bukan paksaan."],
    ["IX","The Hermit","Menyelami gelapnya isi kepala sendiri, ditemani cahaya kecil yang menuntunmu pulang ke jati diri.","Menyepi jauh dari keramaian demi mencari jawaban, lalu ada seseorang yang diam-diam menyusul."],
    ["X","The Wheel of Fortune","Sama seperti musim yang berganti, roda nasib akan berputar membawa bagiannya masing-masing.","Nasib berbalik dalam semalam: yang di puncak turun, yang terpuruk naik."],
    ["XI","Justice","Keadilan akan melegakan mereka yang terluka, sekaligus memperingatkan mereka yang sengaja melukai.","Perbuatan lama akhirnya menagih hasilnya, dan tak ada yang bisa menawar."],
    ["XII","The Hanged Man","Belajarlah berhenti sejenak. Kadang, tidak mengambil tindakan apa pun adalah keputusan paling bijak.","Terjebak menunggu dan terpaksa diam, lalu dunia tampak berbeda sekali dari sudut itu."],
    ["XIII","Death","Sebuah babak harus rela ditutup, supaya lembaran baru yang lebih luas bisa terbuka.","Satu hal yang harus ditinggalkan selamanya agar hidup bisa mulai lagi dari awal."],
    ["XIV","Temperance","Segala sesuatu yang berlebihan itu rapuh; kuncinya ada pada keseimbangan dan kesabaran yang sabar merawat waktu.","Dua hal yang bertolak belakang belajar saling meracik, pelan-pelan, takaran demi takaran."],
    ["XV","The Devil","Rasa terbelenggu sering kali bukan karena orang lain, tapi karena kita sendiri yang terlalu lekat menggenggam kesenangan semu.","Rantai yang sebenarnya longgar, dan seseorang yang belum sadar bahwa ia bisa pergi kapan saja."],
    ["XVI","The Tower","Saat segalanya runtuh berkeping-keping, itu tanda cara lama sudah usang dan kamu butuh keyakinan baru.","Rahasia yang lama disembunyikan pecah tepat saat semuanya tampak baik-baik saja."],
    ["XVII","The Star","Percayalah pada semesta; di saat paling gelap sekalipun, selalu ada cahaya yang disiapkan untukmu.","Malam tenang setelah badai, ketika harapan datang lagi dalam bentuknya yang paling kecil."],
    ["XVIII","The Moon","Jangan takut pada gelapnya malam, biarkan intuisimu menjadi terang yang menuntun langkahmu.","Sesuatu yang tampak jelas ternyata hanya bayangan, dan kebenarannya baru kelihatan saat fajar."],
    ["XIX","The Sun","Berbanggalah, karena kamu memang layak berjalan dengan kepala tegak dan senyum penuh keyakinan.","Adegan hangat tanpa beban, dengan tawa yang pecah tanpa alasan apa-apa."],
    ["XX","Judgement","Kesadaran baru sedang mengetuk pintu jiwamu, lahir dari jujurnya proses perenungan diri.","Masa lalu mengetuk pintu dan menuntut jawaban: diterima, atau dilepas."],
    ["XXI","The World","Pada akhirnya, segala lelah perjalanan ini bermuara pada rasa utuh, damai, dan genapnya dirimu.","Menoleh ke belakang pada seluruh perjalanan, lalu sadar sudah sejauh dan seutuh ini."]

   [["Pelepasan emosional yang tulus selalu membawa kelegaan dan kejernihan baru di dalam batin.","Tangis yang akhirnya pecah setelah lama ditahan, dan kelegaan yang datang sesudahnya."],

   [["Percayalah pada instingmu; jika sebuah gagasan terasa benar di hati, mulailah melangkah dan wujudkan.","Satu gagasan muncul tiba-tiba di hari biasa, dan seseorang langsung memutuskan mengejarnya."],

    ["Kemenangan yang manis adalah buah dari ketekunan mengasah potensi terbaik dalam dirimu.","Arak-arakan pulang setelah menang, dan sorak yang terasa asing bagi yang terbiasa sendiri."],
    ["Berdiri teguhlah pada prinsipmu, betapa pun kerasnya dunia mencoba menggoyahkan posisimu.","Berdiri sendirian di atas bukit, menahan kerumunan yang menyerbu dari bawah."],
    ["Kabar baik dan perubahan positif sering kali datang menghampiri tanpa diduga-duga.","Pesan-pesan yang datang bertubi-tubi dan mengubah segalanya dalam satu hari."],
    ["Seseorang yang tangguh bukan yang tak pernah terluka, melainkan yang menolak menyerah setelah jatuh berkali-kali.","Luka di mana-mana tapi masih berdiri, menjaga satu hal yang tak mau dilepas."],

    ["Mulailah petualangan kreatifmu dengan semangat dan energi yang tak pernah padam.","Berangkat tanpa memikirkan pulang, dengan satu ide kreatif yang menyala-nyala."],
    ["Energi positifmu mampu menerangi sekeliling, jadilah sosok tangguh yang berani membela kebenaran.","Seseorang yang berani membela kebenaran, dan hadirnya saja sudah menerangi ruangan."],
    ["Seorang pemimpin sejati tidak mengandalkan paksaan, melainkan memimpin dengan visi dan karisma yang menginspirasi.","Pemimpin yang tak pernah berteriak, tapi semua mengikuti karena percaya pada visinya."]],
   [["Sebuah pemahaman baru yang jernih mampu melenyapkan kabut kebingungan dalam sekejap.","Satu kalimat yang tiba-tiba mengurai seluruh kebingungan."],
    ["Di persimpangan yang sulit, diam sejenak adalah cara terberat untuk memilih tanpa melukai.","Duduk menutup mata dengan dua pedang di pelukan, menolak memilih dulu."],
    ["Luka batin mengajarkan kita arti ketulusan, menguji apakah kita akan menyerah atau bangkit kembali.","Hujan di atas hati yang tertusuk, dan pilihan antara berhenti di sini atau bangkit."],
    ["Istirahat bukanlah tanda kelemahan, melainkan jeda yang menyelamatkan akal sehatmu.","Tidur panjang di ruang sunyi, ketika dunia akhirnya boleh menunggu."],
    ["Kemenangan yang diraih di atas reruntuhan hubungan sebenarnya adalah sebuah kekalahan.","Kemenangan yang membuat semua orang pergi, menyisakan seseorang yang berdiri sendiri."],
    ["Melepaskan masa lalu memang menyakitkan, tapi itu adalah satu-satunya tiket menuju ketenangan.","Perahu yang membawa pergi dari tepi yang menyakitkan menuju air yang lebih tenang."],
    ["Jalan pintas dan rahasia kelam pada akhirnya selalu menuntut bayaran yang setimpal.","Mengendap-endap membawa sesuatu yang bukan miliknya, dengan rasa bersalah mengikuti dari belakang."],
    ["Menyerahkan kendali hidup pada keadaan luar hanya akan membuatmu merasa terkurung oleh sangkar buatan sendiri.","Terikat dan terkurung, padahal pintunya tak pernah dikunci."],
    ["Kecemasan terbesar sering kali hanya hidup di dalam kepala yang menolak berbagi beban.","Terbangun tengah malam oleh pikiran yang terus membesar, padahal tak ada apa-apa di kamar."],
    ["Setelah titik nadir dan kejatuhan terberat, satu-satunya arah tersisa hanyalah berusaha untuk bangkit lagi.","Titik terendah yang sudah di sudut, dan matahari terbit tipis di ujung cakrawala."],
    ["Pikiran yang kritis dan keberanian untuk jujur membuatmu selalu siap menyuarakan ide-ide cemerlang.","Seseorang muda yang tak takut mengatakan apa yang dilihatnya, dengan gagasan setajam pisau."],
    ["Melaju tanpa kenal takut, menembus segala hambatan demi mengejar apa yang diyakini.","Berpacu melawan angin menuju sesuatu yang diyakini, tanpa menoleh ke belakang."],
    ["Gunakan logika dan fakta yang objektif untuk melihat kebenaran dengan utuh, bukan sekadar emosi sesaat.","Menimbang fakta dengan tenang, dan melihat apa yang orang lain tak mau lihat."],
    ["Keputusan yang paling bijak selalu lahir dari kepala dingin, pikiran yang objektif, dan keberanian untuk menegakkan kebenaran.","Keputusan sulit yang diambil dengan kepala dingin, karena kebenaran lebih penting dari kenyamanan."]],
   [["Benih kecil yang dirawat dengan sabar hari ini akan tumbuh menjadi sumber kestabilan di masa depan.","Sebutir benih di telapak tangan, dan taman yang baru akan tumbuh jika dirawat."],
    ["Keseimbangan adalah seni bertahan di tengah gelombang kehidupan yang menuntut kita untuk terus beradaptasi.","Menyulap dua hal sekaligus di tengah ombak, tanpa sekali pun menjatuhkan salah satunya."],
    ["Kerja sama yang solid adalah rahasia di balik setiap karya besar yang tercipta.","Beberapa orang bekerja bersama membangun satu katedral, masing-masing dengan keahliannya."],
    ["Jangan biarkan ketakutan akan kekurangan mengubahmu menjadi seseorang yang kaku dan enggan berbagi.","Memeluk erat semua yang dimiliki sampai tak ada tangan tersisa untuk menerima."],
    ["Saat kamu merasa kedinginan di tengah kesulitan, kepedulian sekecil apa pun bisa terasa begitu luar biasa.","Dua orang berjalan di salju melewati jendela yang hangat, sampai ada yang mengulurkan sedikit kebaikan."],
    ["Hidup adalah lingkaran tentang memberi dan menerima dengan hati yang lapang.","Seseorang membagi apa yang dimilikinya, lalu belajar menerima dengan sama lapangnya."],
    ["Bersabarlah melihat proses buah yang manis butuh waktu untuk matang di pohonnya.","Berdiri di depan kebun yang lama dirawat, menunggu buahnya matang."],
    ["Dedikasi dan ketekunan dalam hal-hal kecil adalah kunci kesempurnaan sebuah karya.","Mengukir satu demi satu dengan telaten, sampai karyanya bisa bicara sendiri."],
    ["Kemandirian dan rasa aman adalah buah manis dari kerja keras yang kau bangun sendiri.","Berjalan sendirian di kebun anggur yang ditanam dengan tangannya sendiri."],
    ["Warisan terbaik bukanlah harta, melahirkan fondasi kehidupan yang kokoh untuk masa depan.","Tiga generasi di satu halaman, dan fondasi yang diwariskan bukan berupa harta."],
    ["Kedekatan dengan alam mengingatkan kita untuk menghargai tubuh dan bumi sebagai rumah.","Seseorang muda menatap sekeping koin di ladang seolah itu benda suci."],
    ["Kesabaran dan komitmen baja adalah andalan utama untuk menuntaskan setiap tanggung jawab.","Menunggang pelan tapi tak pernah berhenti, menuntaskan apa yang pernah dijanjikan."],
    ["Menjadi sosok yang penuh perhatian tidak menghalangimu untuk menjadi cerdas, strategis, dan sukses dalam berbisnis.","Dapur yang hangat dan catatan yang rapi, seseorang yang bisa menyayangi sekaligus menghitung."],
    ["Puncak dari kesuksesan bukan tentang seberapa banyak yang kau miliki, melainkan seberapa banyak orang yang bisa hidup lebih baik karena kehadiranmu.","Seseorang yang berada, tapi yang paling dikenang adalah banyaknya orang yang hidup lebih baik karenanya."]]
  ];
  M.forEach(function(su,si){su.forEach(function(p,ri){
    C.push([SUITS[si][1],RANKS[ri]+" of "+SUITS[si][0],p[0],p[1]]);
    ART.push(ri>9?CROWN+"<g transform='translate(10 14) scale(.8)'>"+SUITS[si][2]+"</g>":SUITS[si][2]);
  })});
  var KEY="kartu-hari-ini-v1", d=new Date();
  var day=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  var seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  var ix=((Math.imul(seed,2654435761)>>>0)>>>8)%C.length, c=C[ix];
  var card=document.getElementById("card"), read=document.getElementById("read");
  document.getElementById("num").textContent=c[0];
  document.getElementById("art").innerHTML="<svg viewBox='0 0 100 100' aria-hidden='true'><g fill='none' stroke='var(--gold)' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'>"+ART[ix]+"</g></svg>";
  document.getElementById("name").textContent=c[1];
  document.getElementById("pesan").textContent=c[2];
  document.getElementById("ide").textContent=c[3];
  document.getElementById("date").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
  function open(on,persist){
    card.classList.toggle("on",on);read.classList.toggle("on",on);
    card.setAttribute("aria-pressed",on?"true":"false");
    if(persist){try{localStorage.setItem(KEY,JSON.stringify({day:day,on:on}))}catch(e){}}
  }
  card.addEventListener("click",function(){open(!card.classList.contains("on"),true)});
  try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.day===day&&s.on)open(true,false)}catch(e){}
})();
</script>
